title: NWSDB Bill Calculator API
host: https://ebis.waterboard.lk
tier: A
category: utilities
probe_delay_seconds: 1.0
ethics: See docs/ETHICS.md
source_docs_in_lankawa:
- docs/INTEGRATIONS.md
endpoints:
- id: bill_calculator
  method: POST
  url: https://ebis.waterboard.lk/api_nwsdb/bill/BillCalculator
  path: /api_nwsdb/bill/BillCalculator
  summary: Domestic bill estimate.
  body_json:
    CategoryId: 1
    NoOfDays: 30
    Consumption: 20
    NoOfHouses: 1
  access: json_api
- id: get_tariff_adjustment
  method: GET
  url: https://ebis.waterboard.lk/api_nwsdb/bill/getTariffAdjustment
  path: /api_nwsdb/bill/getTariffAdjustment
  summary: 'PARK — 404s (checked case variants too). Sibling bill_calculator
    endpoint on the same host still works fine, so this is a genuinely moved/
    removed path, not a host outage. ebis.waterboard.lk is an API-only host
    with no browsable frontend to find the real path from; needs the actual
    consumer frontend (main waterboard.lk site) inspected for the correct
    call, not attempted here. Checked 2026-09-14.'
  status: parked
  access: parked
