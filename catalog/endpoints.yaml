title: NWSDB Bill Calculator API
host: https://ebis.waterboard.lk
tier: A
category: utilities
probe_delay_seconds: 1.0
ethics: See docs/ETHICS.md
source_docs_in_lankawa:
- docs/INTEGRATIONS.md
endpoints:
- id: bill_calculator
  method: POST
  url: https://ebis.waterboard.lk/api_nwsdb/bill/BillCalculator
  path: /api_nwsdb/bill/BillCalculator
  summary: Domestic bill estimate.
  body_json:
    CategoryId: 1
    NoOfDays: 30
    Consumption: 20
    NoOfHouses: 1
  access: json_api
- id: get_tariff_adjustment
  method: POST
  url: https://ebis.waterboard.lk/api_nwsdb/bill/getTariffAdjustment
  path: /api_nwsdb/bill/getTariffAdjustment
  summary: 'UN-PARKED 2026-09-14 — found the real frontend at
    ebis.waterboard.lk/DirectPay/#/BillCalculator (linked from waterboard.lk),
    inspected its JS bundle: this is actually a POST with a JSON body
    {FromDate, ToDate, Consumption}, not a GET with no body. That mismatch,
    not a moved path, was the whole bug. Verified working with a stateless
    curl request.'
  body_json:
    FromDate: "2026-08-01"
    ToDate: "2026-08-30"
    Consumption: 20
  access: json_api
